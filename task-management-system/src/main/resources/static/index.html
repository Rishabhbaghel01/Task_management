<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management | Premium Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="toast" class="toast hidden">Message</div>

    <!-- Authentication Container -->
    <div id="auth-container" class="auth-wrapper">
        <div class="glass-panel auth-panel">
            <div class="auth-header">
                <h2>Task Management</h2>
                <p id="auth-subtitle">Welcome back! Please login to your account.</p>
            </div>
            
            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn primary-btn">Sign In</button>
                <p class="switch-auth">Don't have an account? <a href="#" id="show-register">Register here</a></p>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form hidden">
                <div class="input-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" required placeholder="Choose a username">
                </div>
                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required placeholder="Create a password">
                </div>
                <button type="submit" class="btn primary-btn">Create Account</button>
                <p class="switch-auth">Already have an account? <a href="#" id="show-login">Sign In</a></p>
            </form>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div id="dashboard-container" class="dashboard-wrapper hidden">
        <nav class="glass-nav">
            <div class="nav-brand">Task Management</div>
            <div class="nav-actions">
                <span id="user-greeting">Hello, User</span>
                <button id="logout-btn" class="btn outline-btn">Logout</button>
            </div>
        </nav>

        <main class="dashboard-main">
            <section class="task-creation glass-panel">
                <h3>Create New Task</h3>
                <form id="create-task-form" class="task-form">
                    <div class="form-row">
                        <div class="input-group flex-2">
                            <input type="text" id="task-title" required placeholder="Task Title">
                        </div>
                        <div class="input-group flex-1">
                            <select id="task-priority" required>
                                <option value="" disabled selected>Priority</option>
                                <option value="1">1 - Lowest</option>
                                <option value="2">2 - Low</option>
                                <option value="3">3 - Medium</option>
                                <option value="4">4 - High</option>
                                <option value="5">5 - Critical</option>
                            </select>
                        </div>
                        <div class="input-group flex-1">
                            <input type="date" id="task-date" required>
                        </div>
                        <div class="input-group flex-1">
                            <select id="task-status" required>
                                <option value="TODO">To Do</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="DONE">Done</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="input-group flex-1">
                            <input type="text" id="task-desc" placeholder="Task Description (Optional)">
                        </div>
                        <button type="submit" class="btn primary-btn add-btn">Add Task</button>
                    </div>
                </form>
            </section>

            <section class="task-board">
                <div class="board-column">
                    <h4 class="column-header todo-header">To Do</h4>
                    <div id="tasks-todo" class="task-list"></div>
                </div>
                <div class="board-column">
                    <h4 class="column-header inprogress-header">In Progress</h4>
                    <div id="tasks-inprogress" class="task-list"></div>
                </div>
                <div class="board-column">
                    <h4 class="column-header done-header">Done</h4>
                    <div id="tasks-done" class="task-list"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal hidden">
        <div class="glass-panel modal-content">
            <h3>Edit Task</h3>
            <form id="edit-task-form" class="task-form">
                <input type="hidden" id="edit-task-id">
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="edit-task-title" required>
                </div>
                <div class="input-group">
                    <label>Description</label>
                    <input type="text" id="edit-task-desc">
                </div>
                <div class="form-row">
                    <div class="input-group flex-1">
                        <label>Priority</label>
                        <select id="edit-task-priority" required>
                            <option value="1">1 - Lowest</option>
                            <option value="2">2 - Low</option>
                            <option value="3">3 - Medium</option>
                            <option value="4">4 - High</option>
                            <option value="5">5 - Critical</option>
                        </select>
                    </div>
                    <div class="input-group flex-1">
                        <label>Date</label>
                        <input type="date" id="edit-task-date" required>
                    </div>
                    <div class="input-group flex-1">
                        <label>Status</label>
                        <select id="edit-task-status" required>
                            <option value="TODO">To Do</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="DONE">Done</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" id="close-modal-btn" class="btn outline-btn">Cancel</button>
                    <button type="submit" class="btn primary-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
